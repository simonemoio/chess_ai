# Genera il libro d'aperture sui server di GitHub, non sul tuo PC.
# Si lancia a mano: tab Actions -> "Libro d'aperture" -> Run workflow.
# Lo streaming del database Lichess passa dalla rete di GitHub; alla fine
# i file data/libro-*.json vengono committati nel repository da soli.
name: Libro d'aperture

on:
  workflow_dispatch:
    inputs:
      mese:
        description: "Mese del database Lichess (AAAA-MM)"
        default: "2026-09"
      partite:
        description: "Partite per fascia"
        default: "60000"

permissions:
  contents: write

jobs:
  genera:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install python-chess zstandard
      - run: python libro.py --mese "${{ inputs.mese }}" --partite "${{ inputs.partite }}"
      - name: Commit dei file generati
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898729+github-actions[bot]@users.noreply.github.com"
          git add data/libro-*.json
          git diff --cached --quiet && echo "niente di nuovo" && exit 0
          git commit -m "Libro d'aperture ${{ inputs.mese }}"
          git push
